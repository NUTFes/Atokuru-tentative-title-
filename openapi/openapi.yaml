openapi: 3.0.3
info:
  title: t0m0kuru API
  version: 0.4.0
  description: |
    学園祭の模擬店の整理券を管理する API。

    ## 共通のルール
    - API はすべて `/api` の下に置く。それ以外の URL は Echo が FE の静的ファイルを返す
    - JSON の項目名は snake_case にする
    - 日時は ISO 8601（RFC 3339）の文字列で返す。例：`2026-11-21T10:30:00+09:00`
    - 失敗したときは、どの API でも `Error`（`code` と `message`）を返す
    - 来場者のアカウントやログインはない。模擬店側の API にも認証はかけない

    ## 決まっている値
    - 整理券の status：`waiting`（調理中）/ `ready`（調理完了）/ `received`（受け取り済み）
    - 屋台の business_status：`open`（営業中）/ `preparing`（準備中）/ `sold_out`（売り切れ）/ `closed`（閉店）
    - 混雑度：`red` / `yellow` / `green` / `gray`（営業中でない店は `gray`）

    ## 通知（Web Push）
    来場者が整理券の画面で通知を許可すると、FE は `GET /push/vapid-public-key` の公開鍵で購読し、
    `POST /tickets/{publicToken}/push-subscriptions` で購読をサーバーに登録する。
    サーバーは次のときに、その整理券の購読へ通知を送る。
    - 調理完了：整理券が `ready` になったとき（`type: "ready"`）
    - あと3人：ほかの整理券が `received` になって番号が進み、前に何人が3人以下になったとき（`type: "near"`）。1枚につき1回だけ。発券した時点ですでに3人以下なら送らない

    通知の中身（push の data）は API ではないのでこの仕様書の paths にはないが、次の JSON にする。
    文言は多言語対応のため、FE の `sw.js` で `type` を見て組み立てる。
    ```json
    {
      "type": "ready",
      "public_token": "Zp3kq8vN2xYcR7tLm1aB0w",
      "stall_name": "焼きそば研究会",
      "stall_number": "A-01",
      "order_number": 42,
      "people_ahead": 0,
      "url": "/?token=Zp3kq8vN2xYcR7tLm1aB0w"
    }
    ```
    - `type`：`ready`（調理完了）か `near`（あと3人）
    - `people_ahead`：送った時点の前に何人。`ready` では 0
    - `url`：通知を押したときに開く URL

    ## 備考の定型文と翻訳
    店は、よく使う備考を定型文として登録できる（`/stalls/{stallId}/comment-templates`）。
    登録したときに、サーバーが一度だけ英語などに訳して `translations` に保存する（来場者が見るたびには訳さない）。
    発券したときの備考が、その屋台の定型文とまったく同じなら、定型文の訳を整理券にコピーし、
    `GET /tickets/{publicToken}` の `comment_translations` で返す。FE は端末の言語の訳があればそれを、なければ `comment` を出す。
    自由入力の備考は訳さない。サーバーに翻訳の設定がないときや、訳すのに失敗したときは、訳なし（`{}`）で保存する。
# API はすべて /api の下に置く。それ以外の URL は Echo が FE の静的ファイルを返す。
servers:
  - url: /api
tags:
  - name: health
    description: 死活監視
  - name: stalls
    description: 屋台
  - name: tickets
    description: 整理券
  - name: comment-templates
    description: 備考の定型文
  - name: push
    description: 通知（Web Push）
paths:
  /health:
    get:
      operationId: getHealth
      summary: サーバーが動いているかを確認する
      tags: [health]
      responses:
        "200":
          description: 動いている
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /stalls:
    get:
      operationId: listStalls
      summary: 全ての屋台の混雑度・営業状況・HP リンクを取得する（マップ用）
      description: |
        屋台は80店程度なので全件を返す。`stall_number` の昇順に並べる。
        `waiting_count` は status が `waiting` の整理券の数で、混雑度はこれと営業状況から決める。
      tags: [stalls]
      responses:
        "200":
          description: 屋台の一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StallSummary"
        "500":
          $ref: "#/components/responses/InternalError"

  /stalls/{stallId}:
    get:
      operationId: getStall
      summary: 指定した ID の屋台を取得する（パスワード以外）
      description: 模擬店画面のログインでは、この API で店が存在するかを確かめる。
      tags: [stalls]
      parameters:
        - $ref: "#/components/parameters/StallId"
      responses:
        "200":
          description: 屋台
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stall"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /stalls/{stallId}/business-status:
    patch:
      operationId: updateBusinessStatus
      summary: 指定した屋台の営業状況を変更する
      tags: [stalls]
      parameters:
        - $ref: "#/components/parameters/StallId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBusinessStatusRequest"
      responses:
        "200":
          description: 変更したあとの屋台
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stall"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /stalls/{stallId}/tickets:
    get:
      operationId: listStallTickets
      summary: 指定した屋台の整理券の一覧を取得する
      description: |
        整理券は10万件規模になるので、`status` での絞り込みを必須にし、件数も `limit` で制限する。
        店の待ち一覧なら `?status=waiting&status=ready` のように指定する。
        並び順は `order_number` で、`order` で昇順・降順を選ぶ（受け取り済みの新しい順を見たいときは `desc`）。
      tags: [tickets]
      parameters:
        - $ref: "#/components/parameters/StallId"
        - name: status
          in: query
          required: true
          description: 取得する整理券の status。複数指定できる
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            items:
              $ref: "#/components/schemas/TicketStatus"
        - name: limit
          in: query
          required: false
          description: 最大の件数
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: order
          in: query
          required: false
          description: order_number の並び順
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: 整理券の一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createTicket
      summary: 整理券を発行する
      description: |
        `order_number` は屋台ごとに 1 から振る。同時に発行されても重複しない。
        `public_token` は推測されにくいランダムな文字列で、QR コードの URL にはこれを入れる。
        営業中（`open`）でない屋台では発行できず、409 を返す。
      tags: [tickets]
      parameters:
        - $ref: "#/components/parameters/StallId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketRequest"
      responses:
        "201":
          description: 発行した整理券
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /stalls/{stallId}/comment-templates:
    get:
      operationId: listCommentTemplates
      summary: 屋台の備考の定型文を一覧で取得する
      description: 模擬店が使う。登録した順（id の順）に返す。1店あたり最大 30 件。
      tags: [comment-templates]
      parameters:
        - $ref: "#/components/parameters/StallId"
      responses:
        "200":
          description: 定型文の一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommentTemplate"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createCommentTemplate
      summary: 備考の定型文を登録する
      description: |
        模擬店が使う。登録したときに、サーバーが英語などに訳して `translations` に保存する。
        訳せなかったとき（サーバーに翻訳の設定がない、翻訳の API が失敗したなど）も、訳なしで登録する。
        同じ屋台に同じ文がすでにあるときと、1店あたりの上限（30 件）を超えるときは 409（`code: conflict`）を返す。
      tags: [comment-templates]
      parameters:
        - $ref: "#/components/parameters/StallId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentTemplateRequest"
      responses:
        "201":
          description: 登録した定型文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /comment-templates/{templateId}:
    delete:
      operationId: deleteCommentTemplate
      summary: 備考の定型文を削除する
      description: 模擬店が使う。間違えて登録したとき用。発券済みの整理券の備考と訳はそのまま残る。
      tags: [comment-templates]
      parameters:
        - name: templateId
          in: path
          required: true
          description: 定型文の ID
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: 削除した
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /tickets/{publicToken}:
    get:
      operationId: getTicket
      summary: 指定した整理券を取得する（前に何人を含む）
      description: |
        来場者が使う。整理券の ID は連番なので、推測されにくい `public_token` で指定する。
        `people_ahead`（前に何人）は、自分の `order_number` − 同じ屋台で `received` の最大 `order_number` − 1。
        マイナスになるときと、status が `waiting` でないときは 0 にする。
      tags: [tickets]
      parameters:
        - name: publicToken
          in: path
          required: true
          description: 整理券の public_token
          schema:
            type: string
      responses:
        "200":
          description: 整理券
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /tickets/{ticketId}/status:
    patch:
      operationId: updateTicketStatus
      summary: 指定した整理券の status を変更する
      description: |
        模擬店が使う。押し間違いを戻せるように、どの status からどの status にも変更できる。
        `ready` にしたときは `called_at` に今の時刻を入れ、`waiting` に戻したときは空にする。
      tags: [tickets]
      parameters:
        - name: ticketId
          in: path
          required: true
          description: 整理券の ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTicketStatusRequest"
      responses:
        "200":
          description: 変更したあとの整理券
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /push/vapid-public-key:
    get:
      operationId: getVapidPublicKey
      summary: 通知の購読に使う VAPID 公開鍵を取得する
      description: |
        FE が `pushManager.subscribe` の `applicationServerKey` に渡す公開鍵（base64url）を返す。
        FE は静的エクスポートでビルド時に鍵を埋め込めないので、API で渡す。
        サーバーに鍵が設定されていない（通知を使わない）ときは 503 を返す。FE は通知のボタンを出さない。
      tags: [push]
      responses:
        "200":
          description: VAPID 公開鍵
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapidPublicKey"
        "503":
          $ref: "#/components/responses/PushUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /tickets/{publicToken}/push-subscriptions:
    post:
      operationId: createPushSubscription
      summary: 整理券の通知の購読を登録する
      description: |
        来場者が使う。リクエストは、ブラウザの `PushSubscription.toJSON()` をそのまま送ればよい。
        整理券の ID は連番なので、推測されにくい `public_token` で指定する（他人の整理券に通知を登録されないように）。
        同じ整理券に同じ `endpoint` をもう一度登録したときは上書きする（エラーにしない）。
        1つの端末で複数の整理券を持てるので、整理券ごとに登録する。
        受け取り済み（`received`）の整理券には登録できず、400 を返す。
        解除する API はない。受け取り済みになったら送らなくなり、プッシュサーバーが無効と返した購読はサーバーが消す。
      tags: [push]
      parameters:
        - name: publicToken
          in: path
          required: true
          description: 整理券の public_token
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscription"
      responses:
        "204":
          description: 登録した
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    StallId:
      name: stallId
      in: path
      required: true
      description: 屋台の ID
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: リクエストの形や値が正しくない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: bad_request
            message: status は waiting / ready / received のどれかにしてください
    NotFound:
      description: 指定したものが見つからない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: not_found
            message: 屋台が見つかりません
    Conflict:
      description: 今の状態ではできない操作
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: stall_not_open
            message: 営業中でない屋台では整理券を発行できません
    PushUnavailable:
      description: サーバーに VAPID の鍵が設定されておらず、通知を使えない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: push_unavailable
            message: 通知は使えません
    InternalError:
      description: サーバーの中でエラーが起きた
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: internal_error
            message: サーバーでエラーが起きました

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          example: ok

    Error:
      type: object
      description: |
        失敗したときに返す形。`code` はプログラムで見分けるため、`message` は人が読むための文。
        code の種類：`bad_request` / `not_found` / `stall_not_open` / `conflict` / `push_unavailable` / `internal_error`
      required: [code, message]
      properties:
        code:
          type: string
          example: not_found
        message:
          type: string
          example: 屋台が見つかりません

    BusinessStatus:
      type: string
      description: 屋台の営業状況。open（営業中）/ preparing（準備中）/ sold_out（売り切れ）/ closed（閉店）
      enum: [open, preparing, sold_out, closed]
      example: open

    TicketStatus:
      type: string
      description: 整理券の状態。waiting（調理中）/ ready（調理完了）/ received（受け取り済み）
      enum: [waiting, ready, received]
      example: waiting

    Congestion:
      type: string
      description: 混雑度。red / yellow / green / gray（営業中でない店は gray）
      enum: [red, yellow, green, gray]
      example: green

    Stall:
      type: object
      description: 屋台。パスワードは返さない
      required: [id, name, stall_number, hp_link, business_status]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: 焼きそば研究会
        stall_number:
          type: string
          description: 店番号（パンフレットなどに載っている番号）
          example: A-01
        hp_link:
          type: string
          nullable: true
          description: HP のリンク。ない店は null
          example: https://example.com
        business_status:
          $ref: "#/components/schemas/BusinessStatus"

    StallSummary:
      type: object
      description: マップ用の屋台の情報
      required: [id, name, stall_number, hp_link, business_status, waiting_count, congestion]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: 焼きそば研究会
        stall_number:
          type: string
          example: A-01
        hp_link:
          type: string
          nullable: true
          example: https://example.com
        business_status:
          $ref: "#/components/schemas/BusinessStatus"
        waiting_count:
          type: integer
          description: status が waiting の整理券の数
          example: 8
        congestion:
          $ref: "#/components/schemas/Congestion"

    Ticket:
      type: object
      description: 整理券（模擬店画面で使う）
      required: [id, public_token, stall_id, order_number, status, comment, called_at, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          description: 整理券の ID（連番）。URL や QR コードには使わない
          example: 123
        public_token:
          type: string
          description: 推測されにくいランダムな文字列。QR コードの URL に入れる
          example: Zp3kq8vN2xYcR7tLm1aB0w
        stall_id:
          type: integer
          format: int64
          example: 1
        order_number:
          type: integer
          description: 屋台ごとの整理券番号（1 から）
          example: 42
        status:
          $ref: "#/components/schemas/TicketStatus"
        comment:
          type: string
          nullable: true
          description: 備考（メニューなど）。ない場合は null
          example: 焼きそば 大盛り
        called_at:
          type: string
          format: date-time
          nullable: true
          description: 調理完了（ready）にした時刻。まだなら null
        created_at:
          type: string
          format: date-time
          description: 発行した時刻
        updated_at:
          type: string
          format: date-time

    TicketDetail:
      type: object
      description: 整理券（来場者のユーザー画面で使う）。連番の id は返さない
      required: [public_token, stall_id, stall_name, stall_number, order_number, status, comment, comment_translations, called_at, created_at, people_ahead]
      properties:
        public_token:
          type: string
          example: Zp3kq8vN2xYcR7tLm1aB0w
        stall_id:
          type: integer
          format: int64
          example: 1
        stall_name:
          type: string
          example: 焼きそば研究会
        stall_number:
          type: string
          example: A-01
        order_number:
          type: integer
          example: 42
        status:
          $ref: "#/components/schemas/TicketStatus"
        comment:
          type: string
          nullable: true
          example: 焼きそば 大盛り
        comment_translations:
          $ref: "#/components/schemas/Translations"
        called_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        people_ahead:
          type: integer
          minimum: 0
          description: 自分の前に何人いるか
          example: 3

    CreateTicketRequest:
      type: object
      properties:
        comment:
          type: string
          nullable: true
          maxLength: 200
          description: 備考（メニューなど）。なければ省略するか null
          example: 焼きそば 大盛り

    Translations:
      type: object
      description: |
        訳。キーは言語コード（`locales/` のファイル名と同じ。今は `en`）、値は訳した文。
        訳がないときは空のオブジェクト（`{}`）。
      additionalProperties:
        type: string
      example:
        en: Yakisoba, large

    CommentTemplate:
      type: object
      description: 備考の定型文
      required: [id, stall_id, comment, translations, created_at]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        stall_id:
          type: integer
          format: int64
          example: 1
        comment:
          type: string
          example: 焼きそば 大盛り
        translations:
          $ref: "#/components/schemas/Translations"
        created_at:
          type: string
          format: date-time

    CreateCommentTemplateRequest:
      type: object
      required: [comment]
      properties:
        comment:
          type: string
          minLength: 1
          maxLength: 200
          description: 定型文。前後の空白は取り除く。整理券の備考と同じく 200 文字まで
          example: 焼きそば 大盛り

    UpdateTicketStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/TicketStatus"

    UpdateBusinessStatusRequest:
      type: object
      required: [business_status]
      properties:
        business_status:
          $ref: "#/components/schemas/BusinessStatus"

    VapidPublicKey:
      type: object
      required: [public_key]
      properties:
        public_key:
          type: string
          description: VAPID 公開鍵（base64url）
          example: BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSgSnfckjBJuBkr3qBUYIHBQFLXYp5Nksh8U

    PushSubscription:
      type: object
      description: |
        ブラウザの `PushSubscription.toJSON()` の形。項目名はブラウザに合わせているので snake_case ではない。
        `endpoint` は https の URL にする（サーバーはこの URL に通知を送る）。
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
          maxLength: 2048
          description: プッシュサーバーの URL（https）
          example: https://fcm.googleapis.com/fcm/send/abc123
        expirationTime:
          type: number
          format: double
          nullable: true
          description: ブラウザが付けてくる有効期限。サーバーでは使わない
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh:
              type: string
              maxLength: 256
              description: 通知を暗号化するための公開鍵（base64url）
            auth:
              type: string
              maxLength: 256
              description: 通知を暗号化するための認証用の値（base64url）
